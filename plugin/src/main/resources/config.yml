# BTCCore — runtime plugin configuration.
#
# World and data source configuration lives in plugins/SlimeWorldManager/, and the server-side
# BTCCore modules read config/BTCCore/. This file only holds what the runtime plugin itself needs.

bridge:
  # Any value below may be written `${env:NAME}` — it is then read from the process environment, and
  # the reference must fill the WHOLE value. This exists because one CloudNet template is shared by
  # every task while `backend-id` must differ per server, and because a service is handed no name of
  # its own (measured 17/09/2026: no environment variable, no system property). An unset variable is
  # never replaced by the literal reference: the bridge refuses to start and NAMES the variable. In
  # an allow-list, an entry whose variable is unset is dropped, which can only narrow what is
  # accepted — never widen it.
  #
  # When the backend bridge to BTCVelocity is active.
  #   auto — only when this server is actually behind a Velocity proxy (modern forwarding enabled
  #          in config/paper-global.yml). This is the default: a standalone server never opens the
  #          channel and never runs the health task.
  #   on   — always, even without a detected proxy. Use when forwarding is terminated elsewhere.
  #   off  — never.
  mode: auto

  # This backend's identity on the bridge. REQUIRED as soon as the bridge opens, and it must be
  # unique to this server. There is no default: `Bukkit.getName()` used to serve as one, but it
  # returns the name of the server IMPLEMENTATION (`BTC-CORE`), identical on every backend — two
  # servers would have introduced themselves under one name and silently shared a slot in the
  # proxy's health registry. An absent or empty value is refused, saying so — left commented out on
  # purpose: a shipped default would hand every installation the same name, which is the very thing
  # being removed here.
  # backend-id: btc-skyblock-1
  # backend-id: ${env:BTC_BRIDGE_BACKEND_ID}   # under an orchestrator

  # Proxies allowed to send us control messages. Empty means none: the bridge answers nobody until
  # this is filled in, which is deliberate — an unauthenticated proxy must not be able to make a
  # backend load worlds.
  allowed-backends: []

  # Backends this server accepts as a target. Empty means "only ourselves".
  allowed-targets: []

  # Worlds a proxy may ask us to preload. Empty means none.
  allowed-worlds: []

  # Second destination tried during a graceful stop, when the proxy refuses to move a player to the
  # one the operator asked for. Left out on purpose: absent means "no second chance", and a player
  # the proxy refuses twice — or refuses once with no fallback declared — is named in the log and
  # left behind rather than sent somewhere nobody checked. Exactly one retry per player.
  # fallback-target: lobby

  # Wire and resource bounds. Every value is clamped to the range shown; a value outside it is
  # brought back to the nearest bound rather than rejected.
  max-payload-bytes: 32768        # 1024 .. 1048576
  max-string-length: 128          # 16 .. 4096
  max-world-name-length: 64       # 16 .. 256
  max-username-length: 32         # 1 .. 128
  max-party-members: 64           # 1 .. 256
  max-loaded-worlds: 32           # 1 .. 256
  max-message-lifetime-ms: 300000 # 1000 .. 3600000
  max-clock-skew-ms: 30000        # 0 .. 300000
  dedup-window-ms: 120000         # 1000 .. 900000
  max-dedup-entries: 1024         # 16 .. 8192
