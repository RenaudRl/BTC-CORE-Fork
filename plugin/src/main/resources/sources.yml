# Inside this file is the configuration options
# for the data sources that ASP supports

# ==================== MySQL ====================
mysql:
  enabled: false
  host: 127.0.0.1
  port: 3306
  username: slimeworldmanager
  password: ''
  database: slimeworldmanager
  usessl: false

# ==================== PostgreSQL ====================
# PostgreSQL support for SlimeWorld.
# Uses the same schema as MySQL but with PostgreSQL-compatible SQL.
# Requires the PostgreSQL JDBC driver (included in BTC Core).
postgresql:
  enabled: false
  host: 127.0.0.1
  port: 5432
  username: slimeworldmanager
  password: ''
  database: slimeworldmanager
  usessl: false

# ==================== MongoDB ====================
mongodb:
  enabled: false
  host: 127.0.0.1
  port: 27017
  auth: admin
  username: slimeworldmanager
  password: ''
  database: slimeworldmanager
  collection: worlds
  uri: ''

# ==================== Redis / DragonFly / Valkey ====================
# All three are Redis-protocol compatible.
# - redis: Standard Redis server
# - dragonfly: DragonFlyDB (multi-threaded Redis alternative, https://dragonflydb.io)
# - valkey: Valkey (open-source Redis fork by Linux Foundation, https://valkey.io)
#
# The backend-type determines which loader name is used internally.
# All use the same RedisLoader with Lettuce client.
redis:
  enabled: false
  uri: redis://127.0.0.1/
  backend-type: redis  # Options: redis, dragonfly, valkey

# ==================== File ====================
file:
  path: slime_worlds

# ==================== API ====================
api:
  enabled: false
  ignoreSslCertificate: false
  username: ''
  token: ''
  url: ''
