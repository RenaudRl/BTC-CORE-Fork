################################################################
# BTCCore Configuration - BTC Server 26.3
#
# Central config for every BTC Core feature (server-side fork of
# AdvancedSlimePaper: Paper + SlimeWorld). Each option below is
# wired to an NMS hook, a Bukkit event, or a Paper config bridge.
#
# Changes require a full server restart.
# GameRules per Slime World are configured separately in
#   config/BTCCore/slimeworld-config.yml
################################################################

# Internal config version. Do not modify (used for automatic migrations).
config-version: 1

################################################################
# WORLD / DIMENSIONS
################################################################
world:
  overworld-only: false        # When true, NO nether and NO end world is ever generated or
                               # loaded â€” at startup and through the plugin API alike. This
                               # overrides bukkit.yml 'settings.allow-end', paper-global
                               # 'misc.enable-nether' and server.properties, whatever they say.
                               # Overworld-type worlds (skyblock, slime worlds, ...) are
                               # unaffected.
  # World quarantine. A world whose tick throws stops the server (vanilla). With this on, a Slime
  # world other than the default world is taken out instead: a crash report is written for it, it
  # stops ticking, its players are moved to the default world (or kicked), then it is unloaded. The
  # other worlds finish their tick first. The server still stops for the default world, a world that
  # is not a Slime world, an out-of-memory or internal JVM error, or a world that cannot be emptied.
  quarantine:
    enabled: false             # Off = vanilla: the first world that throws stops the server.
    save-before-unload: true   # Save the world once, players out, before unloading it (never after an
                               # Error such as a stack overflow). false = it comes back as last saved,
                               # while inventories were kept: a way to duplicate items.
    max-per-minute: 3          # More quarantines than this within a minute stop the server: that many
                               # worlds failing is a fault of the server, not of a world.

################################################################
# PORTAL POLICY
# Which worlds may have a portal at all. BTC 'nether' and 'end' worlds are
# NORMAL-type worlds, so a Nether portal frame lights anywhere and leads
# nowhere; this policy is how an operator stops that.
#
# Default is OBSERVE: every portal creation is journaled as one key=value line
# ("[Portals] event=create mode=... verdict=... rule=... world=... reason=..."),
# and NOTHING is cancelled. Uses of an existing Nether portal are journaled too
# (event=travel): at INFO for players and for refusals, at DEBUG for other
# entities, one line per entity per 30 s.
# Read the journal, fill 'allowed-worlds', then switch to 'enforce'.
#
# WARNING - ISLANDS: in 'enforce', cancelling a creation means NO portal can be
# lit in a world that is not in 'allowed-worlds'. BTCSky's portal listener
# (PlayerPortalEvent, warps island players) then never fires for a new portal
# there. List the island worlds (btc_skyblock_*) in 'allowed-worlds' as soon as
# you switch to 'enforce', or island portals stop working.
################################################################
portals:
  mode: observe                # observe = journal only, cancel nothing (default)
                               # enforce = cancel creation outside 'allowed-worlds'.
                               # An unreadable value is treated as observe.
  allowed-worlds: []           # Worlds where creating a portal is permitted: exact name,
                               # prefix*, *suffix or regex:^...$ (same syntax as the
                               # zero-features worlds). A single value without brackets is
                               # read as a one-element list. Empty = no world: in enforce
                               # mode every portal creation is refused, except
                               # END_PLATFORM. Example: [btc_skyblock_*, td_nether_*]
  exempt-reasons: [END_PLATFORM]  # Creation reasons never refused, whatever the world.
                               # Known: FIRE (frame set alight), NETHER_PAIR (exit portal
                               # built for an entity that entered one), END_PLATFORM (the
                               # obsidian platform generated when entering the End).
                               # END_PLATFORM is ALWAYS exempt, listed or not: refusing it
                               # strands whoever just went through.
  travel:
    deny-outside-allowed-worlds: false   # Enforce mode only: an entity standing in a Nether portal
                               # is not teleported (its readiness is reset) when the world
                               # it stands in is NOT allowed. It judges the world of the
                               # portal, not the destination: a player in a non-allowed
                               # world cannot leave it through an existing portal.
                               # End portals and gateways are never touched.
                               # Same island warning as above.

################################################################
# ZERO FEATURES
# Switch a whole vanilla subsystem OFF for maximum performance.
# By default a feature applies to ALL worlds; restrict it with the
# 'worlds' list (exact name, prefix*, *suffix, or regex:^...$), or per
# feature with 'worlds-per-feature'.
# NOTE: 'recipes' and 'advancements' act on a single server-wide registry,
# so they always apply SERVER-WIDE and ignore any world scope. They remove
# ALL content, custom included â€” if you only want the vanilla content gone,
# use the 'vanilla-content' section instead.
################################################################
zero-features:
  recipes: false               # SERVER-WIDE. Kill the recipe system: NO recipe is loaded at all,
                               # custom ones included. To only remove the vanilla recipes while
                               # keeping your own, leave this false and use vanilla-content below.
  advancements: false          # SERVER-WIDE. Kill the advancement system: NO advancement is loaded
                               # at all, custom ones included. Same remark as recipes.
  stats: false                 # Never track, load or save player statistics.
  light-engine: false          # Skip light propagation updates (use only on fully-lit/void worlds).
  collisions: false            # Disable entity-vs-entity push collisions.
  cramming: false              # Disable entity cramming damage.
  block-updates: false         # Suppress neighbour block-update physics AND liquid spreading.
                               # This is not a throttle: a world in scope has NO redstone at all
                               # (nothing propagates from a changed block), no gravity, no falling
                               # blocks, no water/lava flow. Scheduled block ticks still run, so
                               # circuits look half-alive: a repeater still blinks but the wire it
                               # feeds never lights up, and re-placing a block "fixes" it locally.
                               # Only ever put fully static worlds (hubs, void lobbies) in scope.
  sleep-tick: false            # Disable the sleep -> skip-night mechanic.
  force-void-generator: false  # Force an empty (void) chunk generator for matched worlds.
  worlds:                      # Default world scope for the per-world zero-features above
    - "zero_*"                 # (patterns supported; an empty list means every world).
  worlds-per-feature: {}       # Optional per-feature scope, overrides 'worlds' for that feature.
                               # Keys: stats, light-engine, collisions, cramming, block-updates,
                               # sleep-tick, void-generator. Use ["*"] for every world. Example:
                               #   worlds-per-feature:
                               #     light-engine: ["hub"]
                               #     sleep-tick: ["*"]

################################################################
# VANILLA CONTENT
# Independent from the zero-features: these only drop the content shipped in the
# "minecraft" namespace, at load time. Every other namespace (your datapacks, your
# plugins) is left untouched, so custom advancements and recipes keep working.
################################################################
vanilla-content:
  purge-advancements: false    # Load no minecraft:* advancement. Custom namespaces still load.
  purge-recipes: false         # Load no minecraft:* recipe. Custom namespaces still load.
  preserve-special-recipes: true  # Spare the 31 recipes whose behaviour lives in server code:
                               # leather/wolf-armor dyeing, tipped arrows, fireworks, tool repair,
                               # book and banner duplication, map extending, shield decoration,
                               # decorated pots. The Bukkit API exposes NO constructor for these,
                               # so purging them is irreversible - no plugin can bring them back.
                               # They are generic behaviours, not progression items, so there is
                               # nothing to gate behind a level. Only set this false if you really
                               # want dyeing and firework crafting gone from the server.
  purge-special-recipes: []    # Special paths to purge anyway, carved out of the list above.
                               # 'preserve-special-recipes' is all-or-nothing: without this, a
                               # server wanting its own fireworks would also lose dyeing, banner
                               # duplication and tool repair. Example, to gate rockets and dyeing
                               # behind your own levelled recipes:
                               #   purge-special-recipes: ['firework_rocket', 'firework_star']
                               # Rockets fuel the elytra, so purging them puts late-game travel
                               # behind whatever recipe you register in their place. Register the
                               # replacement first.
  preserve-recipes: []         # Extra minecraft:* recipe paths to spare, e.g. ['bread', 'torch'].
                               # Paths only, without the "minecraft:" prefix. Additive to the list
                               # above; ignored when purge-recipes is false.

  purge-loot: false            # Load no minecraft:* loot table under the prefixes below.
                               # READ THIS BEFORE SWITCHING IT ON: loot tables do not only produce
                               # drops. The same registry drives fishing, shearing, structure
                               # chests, villager gifts, archaeology, brushing, spawner contents and
                               # mob equipment - fourteen directories in 26.2, of which two are
                               # drops. Nothing replaces a purged table: a block whose table is gone
                               # drops nothing at all unless a plugin registers a drop provider
                               # through the BTCCore drop API. Register the provider first, then
                               # purge.
  purge-loot-prefixes:         # The only directories the purge may touch. A directory absent from
    - 'blocks/'                # this list is never purged, whatever purge-loot says - including one
    - 'entities/'              # a future Minecraft version invents.
                               # The two defaults are exactly what the drop API covers. The others,
                               # for reference: archaeology/ brush/ carve/ charged_creeper/ chests/
                               # dispensers/ equipment/ gameplay/ harvest/ pots/ shearing/ spawners/
  preserve-loot: []            # Exact minecraft:* loot table paths to spare, whatever the prefixes
                               # say, e.g. ['blocks/ancient_debris', 'entities/ender_dragon'].
                               # Paths only, without the "minecraft:" prefix.

################################################################
# WORKSTATIONS
# Four stations build their result in server code, not from a recipe file, so no
# purge above can reach them. Blocking happens at the block itself, which covers
# every path - the hopper included, not just a player right-clicking.
#
# All off by default: this fork behaves like vanilla until you ask otherwise.
# Turn one on only once you have a replacement for it, or the players simply
# lose the feature.
################################################################
workstations:
  block-grindstone: false          # Refuse to open the grindstone menu (disenchant, repair).
  block-loom: false                # Refuse to open the loom menu (banner patterns).
  block-cartography-table: false   # Refuse to open the cartography menu (enlarge, copy, lock).
  block-composter: false           # Refuse every fill, by player or hopper. A full composter
                                   # can still be emptied, so nothing gets stuck when you flip
                                   # this on with composters already standing in the world.

################################################################
# SLIME WORLD
################################################################
slime-world:
  async-chunk-loading: true    # Load Slime World chunks off the main thread.

################################################################
# ASYNC PROCESSING
# 'entity-tracker' and 'pathfinding' used to live here. Both hooks touched
# entity and world state off their owning thread and were removed; a file
# that still carries them gets a warning at startup and the keys are ignored.
# Their replacements below are off by default. Their worker threads write to
# nothing in the world: every change to an entity, a path or a chunk is made
# on the tick thread.
################################################################
async:
  mob-spawning:
    enabled: true              # Async mob spawning (requires per-player-mob-spawns in Paper).
  # Parallel entity tracker (DivineMC port). Worker threads only work out which entities changed
  # audience; every change and every packet stays on the tick thread, which waits for them first.
  parallel-tracker:
    enabled: false             # Off = Paper's tracker, untouched. Worth trying with many players and entities.
    threads: 0                 # Worker threads (0 = auto: half the cores, 4 at most).
  # Async pathfinding (Petal/Kaiiju/Leaf port). The request is prepared and the path is applied on
  # the tick thread; only the A* search runs on worker threads. They read the live chunk sections
  # and the mob's state without a lock while the tick goes on, so a path can be stale when it is
  # applied; they never read a block entity (a shulker box counts as a full block). Frogs, turtles,
  # axolotls, drowned, sniffers, creakings and any mob whose class redefines onPathfindingStart or
  # onPathfindingDone keep the vanilla synchronous search.
  async-pathfinding:
    enabled: false             # Off = vanilla search on the calling thread. Worth trying with many pathfinding mobs.
    threads: 0                 # Worker threads (0 = auto: a quarter of the cores).
  # Async player data save (Nitori port, via Leaf). The saving thread encodes the player; the
  # <uuid>.dat is written on two worker threads, in order for each player, as a temporary file that
  # only replaces the last good one once it is whole on disk. A queued save always lands before
  # that player is read again, before a backup copy, and before the server stops.
  player-data-save:
    enabled: false             # Off = vanilla save on the calling thread, untouched.

################################################################
# PARALLEL WORLD TICKING (DivineMC port, from SparklyPaper)
# Each world ticks on its own thread; the main thread waits for all of
# them, then carries on (players, connections, plugin schedulers) as before.
# The tick stays as long as the slowest world: this only pays when several
# worlds are expensive at the same time.
#
# EXPERIMENTAL - bench only for now. Synchronous listeners run on the thread
# of the world that fired the event, several worlds at once: a plugin that
# touches another world from a listener is refused with an exception, and one
# that shares unsynchronised state between worlds will break. A teleport to
# another world asked from a listener is made at the end of the tick (use
# teleportAsync to know the outcome); worlds are created, loaded and unloaded
# from the main thread only. Never wait (.join()) for a chunk of another
# world from a listener: nothing can catch that deadlock. Read once at startup.
################################################################
parallel-world-ticking:
  enabled: false               # Off = every world ticks on the main thread, one after the other, untouched.
  threads: 0                   # Worlds ticking at the same time (0 = auto: half the cores).

################################################################
# DAB - Dynamic Activation of Brain (Pufferfish port)
# Periodically lowers AI tick frequency for entities far from players.
################################################################
dab:
  enabled: false               # Enable Dynamic Activation of Brain.
  start-distance: 12           # Blocks from a player before AI throttling begins.

################################################################
# PERFORMANCE
################################################################
performance:
  collision-throttle:
    enabled: true              # Skip entity collision checks in dense areas.
    max-entities: 10           # Nearby-entity count above which collisions are skipped.

  particle-culling:
    enabled: true              # Don't send particles to players beyond a distance.
    distance: 64               # Particle send radius, in blocks.

  sound-culling:
    enabled: true              # Don't send sounds to players beyond a distance.
    distance: 48               # Sound send radius, in blocks.

  better-hud-culling:
    enabled: true              # Distance-cull BetterHUD packets.
    distance: 48               # BetterHUD send radius, in blocks.

  light-throttle:
    enabled: true              # Cap the number of light updates processed per tick.
    max-per-tick: 500          # Max light updates per tick (atomic counter).

  lazy-chunk-tickets:
    enabled: true              # Keep chunks briefly loaded after use to avoid reload churn.
    retention-ticks: 6000      # Ticks a lazy chunk ticket is retained (6000 = 5 min).

  batched-inventory-updates: false # Coalesce slot packets per (container, slot) and flush once per
                                  # player tick. Opt-in until validated in game.
  chunk-prefetch: true            # Pre-load a 5x5 chunk grid around a player on teleport.
  projectile-pooling: true        # Track and cap the number of active projectiles per world.

  per-world-tick-rate:
    enabled: false             # Lower the tick rate of empty worlds.
    empty-world-tps: 10        # Target TPS for worlds with no players.

  # Per-world view / simulation distance. Paper 26.2 dropped the spigot.yml keys and
  # server.properties only carries one server-wide value, so this is the only per-world lever left.
  # Rules are evaluated in config order, first match wins; -1 (or a missing key) leaves that axis
  # on the server-wide value. Both distances must be in [2, 32] — anything else is ignored with a
  # warning rather than clamped. World patterns follow the zero-features syntax
  # ("name", "prefix*", "*suffix", "regex:^...$", "*").
  # Useful on skyblock: at simulation-distance 12 a single player already ticks 625 chunks, far
  # more than the 225 of a full island, so lowering it lets an explicit island chunk ticket cover
  # the island instead of adding to a mostly empty player radius.
  per-world-distances:
    enabled: false
    rules:
      - worlds: ["btcsky_*"]
        view-distance: 8
        simulation-distance: 4

  hopper:
    throttling: true           # Skip hopper item-move logic every N ticks.
    throttling-ticks: 40       # Hopper processing interval, in ticks.

  suffocation-optimization: true      # Skip suffocation checks for entities far from players.
  inactive-goal-selector-throttle: true # Tick goal selectors less often for distant mobs.

  projectile:
    max-loads-per-tick: 10        # Max chunk loads caused by projectiles per tick (server-wide).
    max-loads-per-projectile: 10  # Max chunk loads a single projectile may trigger.

  vanilla-tick-suppression:
    ai: false                  # Globally disable entity AI ticking (per configured worlds).
    brain: false               # Globally disable Brain ticking.
    sensors: false             # Globally disable Sensor ticking.

  pre-damage-event:
    enabled: true              # Fire PreDamageCalculationEvent (intercept damage before armor calc).

  mspt-threshold: 40           # MSPT above which plugins should back off. Read via BTCCoreAPI.getMsptThreshold().

################################################################
# SECURITY
################################################################
#
# Integrity settings (the Sentinel engine, its checks, its storage) live in anticheat.yml.
# Only two things stay here, deliberately:
#   combat-log — a gameplay rule (kill on logout), not a detection setting
#   cps-limit  — read from an NMS patch; it moves to anticheat.yml with the phase 3 patch work,
#                so that patch and config are verified in a single pass
# A setting that moved out is warned about at startup rather than silently ignored.
#
security:
  combat-log:
    enabled: true              # Punish players who disconnect while in combat.
    tag-duration: 10           # Combat-tag duration, in seconds.
    kill-on-logout: true       # Kill players who log out while combat-tagged.

  cps-limit:
    enabled: true              # Limit clicks-per-second (anti auto-clicker).
    max: 20                    # Maximum allowed clicks per second.
    mining-max: 30             # Maximum allowed arm swings per second while digging a block (a digging
                               # client swings once per tick, 20/s). Still a ceiling: a client that starts
                               # one dig and floods swings is blocked above it. Never below 'max'.


################################################################
# FREEDOM CHAT
# Removes 1.19+ chat reporting / secure-chat friction.
################################################################
freedom-chat:
  enabled: true                # Enable the FreedomChat module.
  rewrite-chat: true           # Deliver player chat as disguised (unsigned) messages.
  enforce-secure-chat: true    # Value advertised to the client as 'secure chat enforced'.
                               # Keep true: false is what makes the client show its
                               # "chat messages can't be verified" warning on join.
  prevent-chat-reports: true   # Refuse the client's chat session, so nothing can be signed
                               # with the player's Mojang key, hence nothing can be reported.

################################################################
# SPAM LIMITER
################################################################
spam-limiter:
  incoming-packet-threshold: -1  # Max incoming packets/tick before spam kick (-1 = disabled).

################################################################
# PACKET LIMITER (safe mode - drops packets, never kicks)
################################################################
packet-limiter:
  all-packets:
    max-rate: 500.0            # Max packets allowed within 'interval'.
    interval: 7.0              # Sliding window, in seconds.
  kick-message: "<red>Exceeded packet rate"  # Message shown if a kick action is used (MiniMessage).

################################################################
# RPG OPTIMIZATIONS (Typewriter-oriented)
################################################################
rpg:
  vanilla-spawns:
    enabled: false             # Toggle vanilla natural mob spawning for RPG worlds.
  weather-ticks:
    enabled: false             # Toggle weather ticking.
  redstone:
    # Compiles active circuits into an in-memory graph (RedPiler-style) instead of reading and
    # writing blocks every update. Only worth it on static builds, hence the world whitelist.
    #
    # Two layers, not two alternatives:
    #   1. This compiler owns the busy circuits of the whitelisted worlds.
    #   2. Paper's wire engine runs everything else: every other world, quiet circuits, circuits
    #      above max-nodes / max-extent. It is NOT set in this file but per world, in
    #      config/paper-world-defaults.yml -> misc.redstone-implementation
    #      (VANILLA | EIGENCRAFT | ALTERNATE_CURRENT). BTC-CORE never reads nor overrides that key,
    #      so Paper's own default applies: VANILLA.
    # Recommended pair: compiler enabled + misc.redstone-implementation: ALTERNATE_CURRENT. It is
    # the only pair benchmarked here (compiler ~4.8x faster than ALTERNATE_CURRENT on a compiled
    # circuit); EIGENCRAFT has never been measured next to the compiler.
    compiler:
      enabled: true            # Master switch for the redstone compiler.
      whitelisted-worlds:      # Worlds where circuits may be compiled.
        - "world_island"
        - "redstone_plots"
      activity-threshold: 32   # Redstone updates in one chunk within the window before compiling.
      activity-window-ticks: 20  # Length of that activity window, in ticks.
      recompile-delay-ticks: 60  # Ticks of quiet after an edit before the zone is compiled again.
      max-nodes: 16384         # Above this many components the circuit is left to vanilla.
      max-extent: 128          # Above this bounding-box size (blocks) the circuit is left to vanilla.

################################################################
# MINING / BREAK SPEED
# The platform writes minecraft:block_break_speed once per block entered. A plugin that binds a
# break-speed provider (BTCCoreAPI#bindBreakSpeedProvider, RPGCore on the BTC server) owns the curve:
# its factor REPLACES the two tables below, and a factor of 0 refuses the block (no crack is drawn).
# The tables apply alone when no provider is bound, or when the provider declines.
################################################################
mining:
  break-speed:
    enabled: false             # Master switch. Off: nothing is computed and no packet is sent.
    tool-affinity:
      enabled: true            # Table: slow down a tool used outside its family.
      off-domain-factor: 0.4   # Factor applied to a tool outside its domain.
    hardness-corrections: true # Table: shorten the two hardness outliers (obsidian, raw ore).
    # DEPRECATED since 26.3 - do not edit. The tier curve is now carried by the bound break-speed
    # provider (RPGCore, editable from the web editor) and the dig hook never reads this list. The
    # key stays readable so an existing file loads and BTCCoreAPI#breakSpeedForTier still answers;
    # it will be removed in a later build.
    tier-curve:
      - 1.0
      - 1.25
      - 1.5
      - 1.8
      - 2.1
      - 2.45
      - 2.8
      - 3.2
      - 3.6
      - 4.0
      - 4.5
      - 5.0
  # Server-driven digging: the server times the dig of the hardness-0 vanilla blocks (crops, sugar
  # cane...) that the provider's plugin published (BTCCoreAPI#publishServerDrivenBlocks). Near such a
  # block the client is shown a break speed of 0 so it never breaks it alone; the server draws the
  # crack and breaks the block when its own clock is done. CraftEngine blocks are never finished here.
  # Requires break-speed.enabled. Off: a server-driven answer is a decline and blocks break as before.
  server-driven:
    enabled: false             # Kill switch. Off: every block goes back to the attribute path.

################################################################
# QUALITY OF LIFE
################################################################
join-queue:
  enabled: false               # Queue players when the server is full.
  max-size: 50                 # Maximum queued players.

qol:
  vanish-levels: true          # Tiered vanish (staff visibility by permission level).
  async-tab-complete: true     # Resolve tab-completion asynchronously.
  # Copies the .dat of every online player to backups/playerdata/<uuid>/<date_time>.dat, off the
  # tick threads. After each copy the oldest copies of that player beyond keep-last are deleted;
  # only files named by this backup, in that player's folder, are ever removed.
  player-data-backup:
    enabled: true              # Periodically back up player data.
    interval-ticks: 6000       # Backup interval, in ticks (6000 = 5 min).
    keep-last: 12              # Copies kept per player (12 = the last hour). 0 = keep them all: clean the folder yourself.

teleport-warmup-ticks: 60      # Warmup before teleport commands resolve, in ticks (0 = instant).

################################################################
# Vanilla statistics in PostgreSQL (BTC)
# One JSON document per player, shared by every server of the network: a statistic gained on one
# server is there on the next one. Off = stats/<uuid>.json exactly as vanilla.
#  - a player's row is held under a lease while the player is online; a server that lost its lease
#    can no longer write the row (its document goes to the local .json instead);
#  - the database is never reached from a tick thread: read at login while the spawn is prepared,
#    written in batches, flushed when the player leaves and when the server stops;
#  - database down: statistics go to stats/<uuid>.json with a <uuid>.json.pending marker and are
#    merged back, highest value of each counter, once the database answers. Known limit: a counter
#    reset during the outage comes back;
#  - zero-features.stats: true keeps this layer closed.
# Secrets come from the environment: a ${env:NAME} value is read from the variable NAME, and an
# unset variable keeps the layer closed (error naming the key and the variable, never a value).
# Encryption: ssl-mode "prefer" encrypts when the database offers it and checks nothing, which is
# only enough on loopback or a private link. A database reached over any other network, and always
# for a public server, needs ssl-mode: verify-full (certificate AND host name checked), with
# ssl-root-cert when the certificate is not signed by an authority the JVM already trusts.
# The older "use-ssl: true" is still read and means verify-full; do not set it with another ssl-mode.
# Database account: give this layer a PostgreSQL role of its own, owner of nothing but its tables,
# in a database or schema of its own (search_path of that role), never a superuser nor the role of
# another plugin: the layer only needs CREATE in that schema and read/write on <prefix>player_stats*.
# Not wired yet for an OFFLINE player (Bukkit OfflinePlayer statistics): those reads see the local
# .json, those writes go to it with a marker and are merged at that player's next login here.
# /btccore stats-sql status | migrate [--merge]   (permission btccore.admin.stats-sql, on top of
# btccore.admin; one migration runs at a time)
################################################################
stats-sql:
  enabled: false               # Off = vanilla statistics files, untouched. Needs a restart.
  host: "${env:BTC_STATS_DB_HOST}"
  port: "${env:BTC_STATS_DB_PORT}"
  database: "${env:BTC_STATS_DB_NAME}"
  username: "${env:BTC_STATS_DB_USER}"
  password: "${env:BTC_STATS_DB_PASSWORD}"
  ssl-mode: prefer             # disable | allow | prefer | require | verify-ca | verify-full (the driver's sslmode).
  ssl-root-cert: ""            # Path of the CA certificate verify-ca and verify-full check against; empty = the driver's default.
  table-prefix: "btc_"         # Lowercase letters, digits and _ only; may be empty.
  connect-timeout-seconds: 10
  socket-timeout-seconds: 10
  load-timeout-ms: 5000        # A login waits at most this long; past it the player comes in on its local file.
  handoff-wait-ms: 3000        # How long a login waits for the previous server to let go of the row (below load-timeout-ms).
  handoff-poll-ms: 100
  handoff-takeover: true       # After that wait: take the row (true) or let the player in on its local file (false).
  lease-seconds: 60
  lease-renew-seconds: 20      # At most a third of lease-seconds.
  batch-interval-ms: 1000      # Queued documents are written this often, the latest of each player only.
  batch-max-size: 200          # ...or as soon as this many players are queued; also the most written in one transaction.
  mirror-json: true            # Also write the local .json when a player leaves (off the tick thread).
  failure-threshold: 3         # Failures in a row before falling back to the files.
  probe-interval-seconds: 30   # How often a database that is down is tried again.
  shutdown-flush-timeout-seconds: 10  # At stop: past this, what is left goes to the files with a marker.

maintenance-mode:
  enabled: false               # Block non-exempt players from joining.
  message: "<red>Server is under maintenance."  # Kick/deny message (MiniMessage).
