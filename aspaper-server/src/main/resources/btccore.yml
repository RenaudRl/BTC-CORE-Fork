################################################################
# BTCCore Configuration - BTC Server 26.2
#
# Central config for every BTC Core feature (server-side fork of
# AdvancedSlimePaper: Paper + SlimeWorld + Folia). Each option below
# is wired to an NMS hook, a Bukkit event, or a Paper config bridge.
#
# Changes require a full server restart.
# GameRules per Slime World are configured separately in
#   config/BTCCore/slimeworld-config.yml
################################################################

# Internal config version. Do not modify (used for automatic migrations).
config-version: 1

################################################################
# WORLD / DIMENSIONS
################################################################
world:
  overworld-only: false        # When true, NO nether and NO end world is ever generated or
                               # loaded â€” at startup and through the plugin API alike. This
                               # overrides bukkit.yml 'settings.allow-end', paper-global
                               # 'misc.enable-nether' and server.properties, whatever they say.
                               # Overworld-type worlds (skyblock, slime worlds, ...) are
                               # unaffected.

################################################################
# ZERO FEATURES
# Switch a whole vanilla subsystem OFF for maximum performance.
# By default a feature applies to ALL worlds; restrict it with the
# 'worlds' list (exact name, prefix*, *suffix, or regex:^...$), or per
# feature with 'worlds-per-feature'.
# NOTE: 'recipes' and 'advancements' act on a single server-wide registry,
# so they always apply SERVER-WIDE and ignore any world scope. They remove
# ALL content, custom included â€” if you only want the vanilla content gone,
# use the 'vanilla-content' section instead.
################################################################
zero-features:
  recipes: false               # SERVER-WIDE. Kill the recipe system: NO recipe is loaded at all,
                               # custom ones included. To only remove the vanilla recipes while
                               # keeping your own, leave this false and use vanilla-content below.
  advancements: false          # SERVER-WIDE. Kill the advancement system: NO advancement is loaded
                               # at all, custom ones included. Same remark as recipes.
  stats: false                 # Never track, load or save player statistics.
  light-engine: false          # Skip light propagation updates (use only on fully-lit/void worlds).
  collisions: false            # Disable entity-vs-entity push collisions.
  cramming: false              # Disable entity cramming damage.
  block-updates: false         # Suppress neighbour block-update physics AND liquid spreading.
                               # This is not a throttle: a world in scope has NO redstone at all
                               # (nothing propagates from a changed block), no gravity, no falling
                               # blocks, no water/lava flow. Scheduled block ticks still run, so
                               # circuits look half-alive: a repeater still blinks but the wire it
                               # feeds never lights up, and re-placing a block "fixes" it locally.
                               # Only ever put fully static worlds (hubs, void lobbies) in scope.
  sleep-tick: false            # Disable the sleep -> skip-night mechanic.
  force-void-generator: false  # Force an empty (void) chunk generator for matched worlds.
  worlds:                      # Default world scope for the per-world zero-features above
    - "zero_*"                 # (patterns supported; an empty list means every world).
  worlds-per-feature: {}       # Optional per-feature scope, overrides 'worlds' for that feature.
                               # Keys: stats, light-engine, collisions, cramming, block-updates,
                               # sleep-tick, void-generator. Use ["*"] for every world. Example:
                               #   worlds-per-feature:
                               #     light-engine: ["hub"]
                               #     sleep-tick: ["*"]

################################################################
# VANILLA CONTENT
# Independent from the zero-features: these only drop the content shipped in the
# "minecraft" namespace, at load time. Every other namespace (your datapacks, your
# plugins) is left untouched, so custom advancements and recipes keep working.
################################################################
vanilla-content:
  purge-advancements: false    # Load no minecraft:* advancement. Custom namespaces still load.
  purge-recipes: false         # Load no minecraft:* recipe. Custom namespaces still load.
  preserve-special-recipes: true  # Spare the 31 recipes whose behaviour lives in server code:
                               # leather/wolf-armor dyeing, tipped arrows, fireworks, tool repair,
                               # book and banner duplication, map extending, shield decoration,
                               # decorated pots. The Bukkit API exposes NO constructor for these,
                               # so purging them is irreversible - no plugin can bring them back.
                               # They are generic behaviours, not progression items, so there is
                               # nothing to gate behind a level. Only set this false if you really
                               # want dyeing and firework crafting gone from the server.
  purge-special-recipes: []    # Special paths to purge anyway, carved out of the list above.
                               # 'preserve-special-recipes' is all-or-nothing: without this, a
                               # server wanting its own fireworks would also lose dyeing, banner
                               # duplication and tool repair. Example, to gate rockets and dyeing
                               # behind your own levelled recipes:
                               #   purge-special-recipes: ['firework_rocket', 'firework_star']
                               # Rockets fuel the elytra, so purging them puts late-game travel
                               # behind whatever recipe you register in their place. Register the
                               # replacement first.
  preserve-recipes: []         # Extra minecraft:* recipe paths to spare, e.g. ['bread', 'torch'].
                               # Paths only, without the "minecraft:" prefix. Additive to the list
                               # above; ignored when purge-recipes is false.

  purge-loot: false            # Load no minecraft:* loot table under the prefixes below.
                               # READ THIS BEFORE SWITCHING IT ON: loot tables do not only produce
                               # drops. The same registry drives fishing, shearing, structure
                               # chests, villager gifts, archaeology, brushing, spawner contents and
                               # mob equipment - fourteen directories in 26.2, of which two are
                               # drops. Nothing replaces a purged table: a block whose table is gone
                               # drops nothing at all unless a plugin registers a drop provider
                               # through the BTCCore drop API. Register the provider first, then
                               # purge.
  purge-loot-prefixes:         # The only directories the purge may touch. A directory absent from
    - 'blocks/'                # this list is never purged, whatever purge-loot says - including one
    - 'entities/'              # a future Minecraft version invents.
                               # The two defaults are exactly what the drop API covers. The others,
                               # for reference: archaeology/ brush/ carve/ charged_creeper/ chests/
                               # dispensers/ equipment/ gameplay/ harvest/ pots/ shearing/ spawners/
  preserve-loot: []            # Exact minecraft:* loot table paths to spare, whatever the prefixes
                               # say, e.g. ['blocks/ancient_debris', 'entities/ender_dragon'].
                               # Paths only, without the "minecraft:" prefix.

################################################################
# WORKSTATIONS
# Four stations build their result in server code, not from a recipe file, so no
# purge above can reach them. Blocking happens at the block itself, which covers
# every path - the hopper included, not just a player right-clicking.
#
# All off by default: this fork behaves like vanilla until you ask otherwise.
# Turn one on only once you have a replacement for it, or the players simply
# lose the feature.
################################################################
workstations:
  block-grindstone: false          # Refuse to open the grindstone menu (disenchant, repair).
  block-loom: false                # Refuse to open the loom menu (banner patterns).
  block-cartography-table: false   # Refuse to open the cartography menu (enlarge, copy, lock).
  block-composter: false           # Refuse every fill, by player or hopper. A full composter
                                   # can still be emptied, so nothing gets stuck when you flip
                                   # this on with composters already standing in the world.

################################################################
# SLIME WORLD
################################################################
slime-world:
  async-chunk-loading: true    # Load Slime World chunks off the main thread.

################################################################
# ASYNC PROCESSING (Leaf port)
# Offload heavy per-tick work to background threads.
################################################################
async:
  entity-tracker:
    enabled: false             # Track entities for players asynchronously.
    threads: 0                 # Worker threads (0 = auto: min(cores, 4)).
  pathfinding:
    enabled: false             # Compute mob pathfinding off-thread.
    max-threads: 0             # Worker threads (0 = auto: cores / 4).
    queue-size: 0              # Max queued path requests (0 = auto: threads * 256).
    reject-policy: FLUSH_ALL   # When the queue is full: FLUSH_ALL, CALLER_RUNS, DISCARD, DISCARD_OLDEST.
  mob-spawning:
    enabled: true              # Async mob spawning (requires per-player-mob-spawns in Paper).

################################################################
# DAB - Dynamic Activation of Brain (Pufferfish port)
# Periodically lowers AI tick frequency for entities far from players.
################################################################
dab:
  enabled: false               # Enable Dynamic Activation of Brain.
  start-distance: 12           # Blocks from a player before AI throttling begins.

################################################################
# PERFORMANCE
################################################################
performance:
  collision-throttle:
    enabled: true              # Skip entity collision checks in dense areas.
    max-entities: 10           # Nearby-entity count above which collisions are skipped.

  particle-culling:
    enabled: true              # Don't send particles to players beyond a distance.
    distance: 64               # Particle send radius, in blocks.

  sound-culling:
    enabled: true              # Don't send sounds to players beyond a distance.
    distance: 48               # Sound send radius, in blocks.

  better-hud-culling:
    enabled: true              # Distance-cull BetterHUD packets.
    distance: 48               # BetterHUD send radius, in blocks.

  light-throttle:
    enabled: true              # Cap the number of light updates processed per tick.
    max-per-tick: 500          # Max light updates per tick (atomic counter).

  lazy-chunk-tickets:
    enabled: true              # Keep chunks briefly loaded after use to avoid reload churn.
    retention-ticks: 6000      # Ticks a lazy chunk ticket is retained (6000 = 5 min).

  scoreboard-optimization: true   # Filter scoreboard packet recipients by active display slot.
  batched-inventory-updates: true # Queue inventory slot packets and flush once at tick end.
  nbt-compression-cache: true     # LRU cache for compressed NBT (thread-safe).
  chunk-prefetch: true            # Pre-load a 5x5 chunk grid around a player on teleport.
  projectile-pooling: true        # Track and cap the number of active projectiles per world.

  per-world-tick-rate:
    enabled: false             # Lower the tick rate of empty worlds.
    empty-world-tps: 10        # Target TPS for worlds with no players.

  hopper:
    throttling: true           # Skip hopper item-move logic every N ticks.
    throttling-ticks: 40       # Hopper processing interval, in ticks.

  suffocation-optimization: true      # Skip suffocation checks for entities far from players.
  inactive-goal-selector-throttle: true # Tick goal selectors less often for distant mobs.

  projectile:
    max-loads-per-tick: 10        # Max chunk loads caused by projectiles per tick (server-wide).
    max-loads-per-projectile: 10  # Max chunk loads a single projectile may trigger.

  vanilla-tick-suppression:
    ai: false                  # Globally disable entity AI ticking (per configured worlds).
    brain: false               # Globally disable Brain ticking.
    sensors: false             # Globally disable Sensor ticking.

  pre-damage-event:
    enabled: true              # Fire PreDamageCalculationEvent (intercept damage before armor calc).

  mspt-threshold: 40           # MSPT above which plugins should back off. Read via BTCCoreAPI.getMsptThreshold().

################################################################
# SECURITY
################################################################
security:
  sentinel:                    # Native async anti-cheat (reach + velocity, ghost hitbox cache).
    enabled: true              # Enable the Sentinel anti-cheat engine.
    auto-notify-admins: true   # Auto-send violation alerts to admins with sentinel.admin.
    mysql-logging:
      enabled: false           # Log Sentinel violations to MySQL.
      host: localhost
      port: 3306
      database: btccore
      username: root
      password: ""

  combat-log:
    enabled: true              # Punish players who disconnect while in combat.
    tag-duration: 10           # Combat-tag duration, in seconds.
    kill-on-logout: true       # Kill players who log out while combat-tagged.

  cps-limit:
    enabled: true              # Limit clicks-per-second (anti auto-clicker).
    max: 20                    # Maximum allowed clicks per second.

  reach-validation: true       # Server-side attack reach validation.
  flight-detection: true       # Basic illegal-flight detection.
  exploit-logging: true        # Log suspicious/exploit-like packets and actions.

################################################################
# FREEDOM CHAT
# Removes 1.19+ chat reporting / secure-chat friction.
################################################################
freedom-chat:
  enabled: true                # Enable the FreedomChat module.
  rewrite-chat: true           # Deliver player chat as disguised (unsigned) messages.
  enforce-secure-chat: true    # Value advertised to the client as 'secure chat enforced'.
                               # Keep true: false is what makes the client show its
                               # "chat messages can't be verified" warning on join.
  prevent-chat-reports: true   # Refuse the client's chat session, so nothing can be signed
                               # with the player's Mojang key, hence nothing can be reported.

################################################################
# SPAM LIMITER
################################################################
spam-limiter:
  incoming-packet-threshold: -1  # Max incoming packets/tick before spam kick (-1 = disabled).

################################################################
# PACKET LIMITER (safe mode - drops packets, never kicks)
################################################################
packet-limiter:
  all-packets:
    max-rate: 500.0            # Max packets allowed within 'interval'.
    interval: 7.0              # Sliding window, in seconds.
  kick-message: "<red>Exceeded packet rate"  # Message shown if a kick action is used (MiniMessage).

################################################################
# RPG OPTIMIZATIONS (Typewriter-oriented)
################################################################
rpg:
  vanilla-spawns:
    enabled: false             # Toggle vanilla natural mob spawning for RPG worlds.
  weather-ticks:
    enabled: false             # Toggle weather ticking.
  redstone:
    # Compiles active circuits into an in-memory graph (RedPiler-style) instead of reading and
    # writing blocks every update. Only worth it on static builds, hence the world whitelist;
    # everywhere else redstone stays fully vanilla.
    compiler:
      enabled: true            # Master switch for the redstone compiler.
      whitelisted-worlds:      # Worlds where circuits may be compiled.
        - "world_island"
        - "redstone_plots"
      activity-threshold: 32   # Redstone updates in one chunk within the window before compiling.
      activity-window-ticks: 20  # Length of that activity window, in ticks.
      recompile-delay-ticks: 60  # Ticks of quiet after an edit before the zone is compiled again.
      max-nodes: 16384         # Above this many components the circuit is left to vanilla.
      max-extent: 128          # Above this bounding-box size (blocks) the circuit is left to vanilla.

################################################################
# QUALITY OF LIFE
################################################################
join-queue:
  enabled: false               # Queue players when the server is full.
  max-size: 50                 # Maximum queued players.

qol:
  vanish-levels: true          # Tiered vanish (staff visibility by permission level).
  async-tab-complete: true     # Resolve tab-completion asynchronously.
  player-data-backup:
    enabled: true              # Periodically back up player data.
    interval-ticks: 6000       # Backup interval, in ticks (6000 = 5 min).

teleport-warmup-ticks: 60      # Warmup before teleport commands resolve, in ticks (0 = instant).

maintenance-mode:
  enabled: false               # Block non-exempt players from joining.
  message: "<red>Server is under maintenance."  # Kick/deny message (MiniMessage).
