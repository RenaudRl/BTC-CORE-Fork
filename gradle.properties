group=com.infernalsuite.asp
aspApiVersion=4.2.0-SNAPSHOT
apiVersion=26.3
# 'version' est la numerotation du fork, deliberement distincte de celle d'ASP amont
# (26.3.build.18-alpha au moment de cette fusion) : nos releases ne suivent pas leur cadence.
version=26.3.build.1
mcVersion=26.3
# Version publiee de dev.btc.core:api dans le depot Maven statique BTC Studio.
# Ligne de version propre, independante de 'version' et de 'aspApiVersion'.
btcApiVersion=26.3.build.1-alpha

# Version paper-api publiee (papermc.io) contre laquelle compilent les modules plugin ASP.
# Decouplee de 'version' (numero propre du fork) car ce dernier n'existe pas comme artefact paper-api.
paperApiVersion=26.3.build.26-alpha

paperRef=0fd1cf72ffb8eefe8bd4899620695a77659db42b

org.gradle.caching=true
org.gradle.parallel=true
org.gradle.vfs.watch=false

org.gradle.jvmargs=-Xmx10g
