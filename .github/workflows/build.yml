name: Build & Validate

# BTC Build Pipeline — Template for all BTC projects
# Triggers: Push to any branch (except tags), Pull Request
# Steps: Checkout → Setup Java 25 + Gradle → Build & test → Upload results

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'

  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

env:
  JAVA_VERSION: '25'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Paperweight applique les feature patches en creant des commits git. Sans identite configuree
      # le runner echoue sur `fatal: empty ident name`, et applyAllPatches s'arrete la — c'est ce qui
      # rendait cette CI rouge sans que le code y soit pour quelque chose.
      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # `applyAllPatches` marche en local et pas sur un clone vierge : sa propre description dit
      # qu'elle equivaut a `applyPaperPatches` puis `applyAllServerPatches` "in a second Gradle
      # invocation". La seconde tache n'existe qu'une fois le fork aspaper enregistre dans
      # aspaper-server/build.gradle.kts — fichier gitignore, donc absent du clone. En une seule
      # invocation la CI meurt sur "Task 'applyAllServerPatches' not found".
      - name: Apply Paper patches
        run: ./gradlew applyPaperPatches --no-daemon

      # Sans `forks.register("aspaper")` dans les build.gradle.kts generes, Gradle meurt sur
      # "Task 'applyAllServerPatches' not found". Ces trois editions ne peuvent pas etre des
      # patches : les deux fichiers sont generes, gitignores, et exclus des deux patchDir.
      - name: Register the aspaper fork
        run: python3 scripts/register-aspaper-fork.py

      # Les hooks BTC sont desormais des feature patches appliques par `git am` dans cette etape,
      # au meme titre que ceux d'ASP. Il n'y a plus d'injection a lancer apres coup.
      - name: Apply server patches
        run: ./gradlew :aspaper-server:applyAllServerPatches --no-daemon

      # Un en-tete de hunk faux est accepte par tous les editeurs et refuse par git seulement a
      # l'application, avec un numero de ligne d'un fichier temporaire. C'est ce defaut qui a tenu
      # cette CI rouge pendant des semaines. Ce controle le trouve en millisecondes.
      - name: Check BTC-CORE patches
        run: python3 scripts/check-btccore-patches.py --markdown

      - name: Upload hook inventory
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: hooks-inventory
          path: .docs/hooks-inventory.md

      - name: Build & Test
        run: ./gradlew :aspaper-server:test :aspaper-server:createPaperclipJar --no-daemon

      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Test Results
          path: 'aspaper-server/build/test-results/**/TEST-*.xml'
          reporter: java-junit

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4
