name: Build & Validate

# BTC Build Pipeline — Template for all BTC projects
# Triggers: Push to any branch (except tags), Pull Request
# Steps: Checkout → Setup Java 25 + Gradle → Build & test → Upload results

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'

  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

env:
  JAVA_VERSION: '25'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Paperweight applique les feature patches en creant des commits git. Sans identite configuree
      # le runner echoue sur `fatal: empty ident name`, et applyAllPatches s'arrete la — c'est ce qui
      # rendait cette CI rouge sans que le code y soit pour quelque chose.
      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # `applyAllPatches` marche en local et pas sur un clone vierge : sa propre description dit
      # qu'elle equivaut a `applyPaperPatches` puis `applyAllServerPatches` "in a second Gradle
      # invocation". La seconde tache n'existe qu'une fois le fork aspaper enregistre dans
      # aspaper-server/build.gradle.kts — fichier gitignore, donc absent du clone. En une seule
      # invocation la CI meurt sur "Task 'applyAllServerPatches' not found".
      - name: Apply Paper patches
        run: ./gradlew applyPaperPatches --no-daemon

      # Premier passage : enregistre le fork dans les build.gradle.kts generes. Le script est
      # idempotent, le second passage ne refait que ce qui manque.
      - name: Register the aspaper fork
        run: python3 scripts/apply-btccore-patches.py || true

      - name: Apply server patches
        run: ./gradlew :aspaper-server:applyAllServerPatches --no-daemon

      # L'ordre est contraignant : la couche BTC s'injecte dans la source decompilee, qui n'existe
      # qu'apres les patches. Un `build` seul compilerait un serveur sans aucun hook BTC.
      - name: Apply BTC-CORE hooks
        run: python3 scripts/apply-btccore-patches.py

      # Un hook dont l'ancre a derive est un no-op silencieux : le build reste vert, l'option reste
      # dans btccore.yml, et la fonctionnalite a disparu. C'est ce que cette etape rend impossible.
      - name: Verify BTC-CORE hooks
        run: python3 scripts/verify-btccore-patches.py --markdown

      - name: Upload hook inventory
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: hooks-inventory
          path: .docs/hooks-inventory.md

      - name: Build & Test
        run: ./gradlew :aspaper-server:test :aspaper-server:createPaperclipJar --no-daemon

      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Test Results
          path: 'aspaper-server/build/test-results/**/TEST-*.xml'
          reporter: java-junit

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4
