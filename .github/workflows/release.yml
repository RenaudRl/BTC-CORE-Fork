name: Release

# BTC Release Pipeline with Discord Announcement
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        default: 'patch'
        options: [major, minor, patch, prerelease]
      prerelease:
        description: 'Mark as pre-release?'
        type: boolean
        default: false
      discord_announce:
        description: 'Announce on Discord?'
        type: boolean
        default: true

  push:
    tags:
      'v*'

env:
  DISCORD_WEBHOOK_URL: ${{ vars.DISCORD_WEBHOOK_URL || '' }}
  DISCORD_WEBHOOK_SECRET: ${{ secrets.DISCORD_WEBHOOK_SECRET || '' }}
  DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID || '' }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME || github.event.repository.name }}
  PROJECT_DISPLAY: ${{ vars.PROJECT_DISPLAY || github.event.repository.name }}
  JAVA_VERSION: '25'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          else
            echo "bump=${{ github.event.inputs.bump }}" >> $GITHUB_OUTPUT
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Paperweight applies feature patches by making git commits, and fails with
      # "fatal: empty ident name" on a runner that has no git identity configured.
      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # Same contract as build.yml, and for the same reason: the BTC layer is injected into the
      # decompiled sources, which only exist after applyAllPatches. `./gradlew build` on its own
      # produced a release jar with not a single BTC hook in it.
      - name: Apply Paper patches
        run: ./gradlew applyAllPatches --no-daemon

      - name: Apply BTC-CORE hooks
        run: python3 scripts/apply-btccore-patches.py

      # A hook whose anchor drifted is a silent no-op. Shipping that as a release is worse than
      # failing the build, so the release stops here rather than publishing a hollow server.
      - name: Verify BTC-CORE hooks
        run: python3 scripts/verify-btccore-patches.py --markdown

      - name: Build & Package
        run: ./gradlew :aspaper-server:createPaperclipJar --no-daemon

      # The runnable server is the paperclip jar under aspaper-server/build/libs, not build/libs at
      # the root — that directory holds no server jar at all, so the old glob shipped nothing usable.
      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          shopt -s nullglob
          for jar in aspaper-server/build/libs/*paperclip*.jar; do
            [[ "$jar" =~ -sources\.jar$ || "$jar" =~ -javadoc\.jar$ ]] && continue
            cp "$jar" artifacts/
          done
          if [[ -z "$(ls -A artifacts/)" ]]; then
            echo "::error::no paperclip jar was produced; refusing to publish an empty release"
            exit 1
          fi
          ls -la artifacts/

      # On a manual run the input is a bump *kind* ("patch", "minor"...), never a version. Writing it
      # straight through produced tags like "vpatch"; the version is derived from gradle.properties
      # and the bump is applied to it.
      - name: Resolve version
        id: resolve
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            version="${{ steps.version.outputs.version }}"
          else
            base=$(grep -E '^version=' gradle.properties | cut -d= -f2)
            core=${base%%-*}
            suffix=""
            [[ "$base" == *-* ]] && suffix="-${base#*-}"
            IFS='.' read -r -a parts <<< "${core//build./build_}"
            case "${{ github.event.inputs.bump }}" in
              major) version="$(( ${parts[0]} + 1 )).0" ;;
              minor) version="${parts[0]}.$(( ${parts[1]:-0} + 1 ))" ;;
              *)     version="${core}$( [[ -n "$suffix" ]] && echo "" )" ;;
            esac
            [[ "${{ github.event.inputs.bump }}" == "prerelease" || "${{ github.event.inputs.bump }}" == "patch" ]] && version="${core}"
            version="${version}${suffix}"
          fi
          echo "version=${version}" >> $GITHUB_OUTPUT
          echo "tag=v${version}" >> $GITHUB_OUTPUT

      - name: Push tag (manual)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.resolve.outputs.version }}" -m "Release v${{ steps.resolve.outputs.version }}"
          git push origin "v${{ steps.resolve.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.resolve.outputs.version }}
          name: ${{ env.PROJECT_DISPLAY }} v${{ steps.resolve.outputs.version }}
          files: artifacts/*
          draft: false
          prerelease: ${{ github.event.inputs.prerelease || false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Announce on Discord
        if: env.DISCORD_WEBHOOK_URL != ''
        run: |
          PAYLOAD=$(jq -nc \
            --arg title "${{ env.PROJECT_DISPLAY }} v${{ steps.resolve.outputs.version }}" \
            --arg version "${{ steps.resolve.outputs.version }}" \
            --arg project "${{ env.PROJECT_DISPLAY }}" \
            --arg url "${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ steps.resolve.outputs.version }}" \
            --arg type "release" \
            --arg channelId "${{ env.DISCORD_CHANNEL_ID }}" \
            '{title: $title, version: $version, project: $project, url: $url, type: $type, channelId: ($channelId | tonumber)}')

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: $DISCORD_WEBHOOK_SECRET" \
            -d "$PAYLOAD")

          echo "Discord response: HTTP $HTTP_CODE"
